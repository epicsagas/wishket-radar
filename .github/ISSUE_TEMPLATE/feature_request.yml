name: Feature Request
description: Suggest an idea or capability for wishket-radar
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make wishket-radar better? Let us know!
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: Is your feature request related to a problem? Please describe.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
