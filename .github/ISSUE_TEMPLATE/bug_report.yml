name: Bug Report
description: Create a report to help us fix an issue in wishket-radar
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of wishket-radar are you using? (`wishket-mcp --version`)
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host Environment
      description: Which AI host environment are you using?
      options:
        - Claude Code
        - Codex
        - Antigravity (agy)
        - Hermes
        - Standalone MCP
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run skill '...'
        2. Enter '...'
        3. See error '...'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Output
      description: Paste any error messages or logs here.
      render: shell
