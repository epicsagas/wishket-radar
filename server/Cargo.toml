[package]
repository = "https://github.com/epicsagas/wishket-radar"
name = "wishket-mcp"
version = "0.1.1"
edition = "2021"
description = "Wishket project search/analysis MCP server"

[dependencies]
rmcp = { version = "3.1", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scraper = "0.27"
lz-str = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[workspace]

# `cargo build --profile dist`. Inherits release + thin LTO for smaller shippable
# binaries. Matches the convention used across epiccounty Rust crates.
[profile.dist]
inherits = "release"
lto = "thin"
