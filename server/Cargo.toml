[package]
repository = "https://github.com/epicsagas/wishket-radar"
name = "wishket-mcp"
version = "0.6.0"
edition = "2021"
description = "Wishket project search/analysis MCP server"

[dependencies]
rmcp = { version = "3.1", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
webbrowser = "0.8"
rand = "0.9"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "stream"] }
futures-util = { version = "0.3", default-features = false }
scraper = "0.27"
lz-str = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }

# state.db·WAL·스냅샷에 평문 BYOK 키가 들어가므로 기동 시 umask 0o077.
# std에 umask가 없어 libc를 직접 쓴다.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[workspace]

# `cargo build --profile dist`. Inherits release + thin LTO for smaller shippable
# binaries. Matches the convention used across epiccounty Rust crates.
[profile.dist]
inherits = "release"
lto = "thin"
