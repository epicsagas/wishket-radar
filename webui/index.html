<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wishket radar</title>
    <script>
      (function () {
        var t
        try { t = localStorage.getItem('wk-theme') } catch (e) { t = null }
        if (t !== 'light' && t !== 'dark') t = 'dark'
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
